<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060E1F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />

    <title>PayLens · Payroll Analytics Platform</title>
    <meta
      name="description"
      content="PayLens — enterprise payroll analytics with forecasting, anomaly detection, role-based dashboards and a 6-step payroll processing wizard."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PayLens" />
    <meta property="og:title" content="PayLens · Payroll Analytics Platform" />
    <meta
      property="og:description"
      content="Forecasting, anomaly detection, role-based dashboards and a payroll wizard. Built for teams that take compensation seriously."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PayLens · Payroll Analytics Platform" />
    <meta
      name="twitter:description"
      content="Enterprise payroll analytics with forecasting, anomaly detection and role-based access."
    />

    <!-- Theme bootstrap: follow the OS preference until the user picks one -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('paylens.theme'); 
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
